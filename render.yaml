# Render Blueprint untuk API FastAPI (https://render.com/docs/blueprint-spec).
# Deploy: Render Dashboard -> New -> Blueprint -> pilih repo ini. Nilai `sync: false` diisi di dashboard
# saat pembuatan (JANGAN tulis secret di file ini). Panduan lengkap: docs/DEPLOYMENT.md
services:
  - type: web
    name: gymnasium-api
    runtime: python
    plan: free
    region: frankfurt  # dekat dengan database Supabase (eu-west-1); tidak bisa diubah setelah dibuat
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION  # default Render untuk service baru adalah 3.14; samakan dengan versi training model
        value: 3.12.10
      - key: DATABASE_URL  # Supabase Session pooler (port 5432)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        value: http://localhost:8501
      - key: LOG_LEVEL
        value: INFO
